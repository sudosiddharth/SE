  background:var(--paper);
  display:flex;flex-direction:column;
  padding:calc(16px + env(safe-area-inset-top,0px)) 22px calc(16px + env(safe-area-inset-bottom,0px));
}
@media (min-width:481px){
  /* Subtract the body padding, or a short desktop window clips the card. */
  .card{
    height:min(calc(100dvh - 56px),880px);
    border-radius:20px;box-shadow:0 24px 60px -28px rgba(26,20,32,.34);
  }
}
/* On a phone the card IS the screen — any body padding would force a scroll. */
@media (max-width:480px){
  body{padding:0;overflow:hidden}
  .card{height:100dvh;max-height:100dvh;width:100%}
}

/* ---------- masthead ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex:none;z-index:3}
.top .mark{height:42px;width:auto;color:var(--purple);display:block}
.top .stamp{
  margin:0;text-align:right;
  font-size:11px;font-weight:500;line-height:1.5;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-soft);
}
.top .stamp b{display:block;font-weight:600;color:var(--purple)}

/* ---------- hero: collage + cut-out ---------- */
.hero{position:relative;flex:1 1 auto;min-height:0;margin:6px -22px 0}
.collage{position:absolute;inset:0;width:100%;height:100%}
/* Shape fills come from the tokens, so the world recolours in one place. */
.collage .f-purple{fill:var(--purple)}
.collage .f-lift{fill:var(--purple-lift)}
.collage .f-t1{fill:var(--tint-1)}
.collage .f-t2{fill:var(--tint-2)}
.subject{
  position:absolute;left:50%;bottom:0;transform:translateX(-50%);
  height:100%;width:auto;max-width:none;object-fit:contain;object-position:bottom;
  filter:drop-shadow(0 14px 22px rgba(26,20,32,.22));
}

/* ---------- identity ---------- */
.id{flex:none;z-index:3;text-align:center;margin-top:2px}
.name{
  margin:0;font-weight:800;font-size:clamp(26px,7.9vw,34px);
  line-height:1.04;letter-spacing:-.028em;text-wrap:balance;
}
.pill{
  display:inline-block;margin:9px 0 0;padding:5px 16px;border-radius:999px;
  background:var(--purple);color:#fff;
  font-size:11px;font-weight:600;letter-spacing:.055em;text-transform:uppercase;
}
.tagline{
  margin:10px 0 0;font-size:14px;font-weight:500;line-height:1.35;color:var(--ink-soft);
}

/* ---------- contact ---------- */
.contact{flex:none;z-index:3;margin-top:13px;border-top:1px solid var(--hair)}
.crow{
  display:flex;align-items:center;gap:11px;
  padding:9px 2px;border-bottom:1px solid var(--hair);
  color:var(--ink);text-decoration:none;
  font-size:14px;font-weight:500;letter-spacing:.005em;
  transition:color .18s ease;
}
/* Mono earns its place on the dialled number only — it is a figure, not a mood. */
.crow .num{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-variant-numeric:tabular-nums;font-size:14px;letter-spacing:.01em;
}
.crow:hover{color:var(--purple)}
.crow svg{width:15px;height:15px;flex:none;stroke:var(--purple);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.crow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.save{
  display:flex;align-items:center;justify-content:center;gap:9px;
  margin-top:12px;min-height:46px;border-radius:10px;
  background:var(--purple);color:#fff;
  font-size:14px;font-weight:600;
  text-decoration:none;transition:background-color .18s ease;
}
.save svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.save:hover{background:var(--purple-deep)}

.foot{
  flex:none;margin-top:10px;text-align:center;
  font-size:14px;font-weight:500;letter-spacing:.01em;color:var(--ink-soft);
}

/* ---------- motion ----------
   One authored moment: the collage blooms and he rises into it. Everything
   below settles on a single shared beat rather than each section repeating the
   same entrance. The masthead is never hidden — it starts visible. */
@keyframes bloom{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes stand{from{opacity:0;transform:translateX(-50%) translateY(16px)}to{opacity:1;transform:translateX(-50%)}}
@keyframes settle{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.collage{animation:bloom .9s cubic-bezier(.16,1,.3,1) both;transform-origin:50% 62%}
/* `stand` must carry translateX(-50%) through: a keyframe ending at
   transform:none would wipe the centring and throw him off the right edge. */
.subject{animation:stand .85s cubic-bezier(.16,1,.3,1) .06s both}
.id,.contact,.foot{animation:settle .55s cubic-bezier(.16,1,.3,1) .34s both}

@media (prefers-reduced-motion:reduce){
  .collage,.subject,.id,.contact,.foot{animation:none;opacity:1;transform:none}
  .subject{transform:translateX(-50%)}
}

/* ---------- print / PDF export ----------
   The PDF is rendered at the card's own size, so the card fills the page and
   nothing animates in mid-capture. */
@page{margin:0}
@media print{
  body{padding:0;background:#fff;display:block;min-height:0}
  /* Height is measured from this layout, so the card sets its own proportions.
     The hero needs an explicit height: with the card auto-height the flex
     child would collapse to zero and the portrait would vanish. */
  .card{width:100%;height:auto;max-height:none;border-radius:0;box-shadow:none}
  .hero{height:360px;flex:none}
  .collage,.subject,.id,.contact,.foot{animation:none;opacity:1;transform:none}
  .subject{transform:translateX(-50%)}
  /* "Save to contacts" points at a relative .vcf — meaningless once the PDF is
     sent on its own, so it is dropped from the export. */
  .save{display:none}
}
</style>
