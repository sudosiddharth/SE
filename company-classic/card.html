<style>
:root{--lilac:#c3b4f2;--lilac-2:#b5a4e9;--purple:#8a73c4;--ink:#130929;--muted:#5c527a;--paper:#f9f9f6;--yellow:#f8f509;--white:#fff}
*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;padding:clamp(0px,3vw,28px);display:flex;align-items:center;justify-content:center;background:#8e7bd0;color:var(--ink);font-family:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:var(--yellow);color:var(--ink)}:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.card{position:relative;isolation:isolate;overflow:hidden;width:min(100%,430px);height:min(100dvh,880px);padding:32px 28px 26px;display:flex;flex-direction:column;background:linear-gradient(145deg,var(--lilac),var(--lilac-2) 58%,#a795e4)}
.card::before{content:"";position:absolute;z-index:-1;inset:-20% -30%;opacity:.4;background:radial-gradient(circle at 18% 30%,rgba(255,255,255,.7),transparent 20%),radial-gradient(circle at 75% 50%,rgba(255,255,255,.28),transparent 25%);transform:rotate(-9deg)}
@media(min-width:481px){.card{height:min(calc(100dvh - 56px),880px);border-radius:22px;box-shadow:0 30px 80px -34px rgba(19,9,41,.65)}}
@media(max-width:480px){body{padding:0}.card{width:100%;height:100dvh}}
.person{text-align:center;position:relative;z-index:2}.person h1{margin:0;font-family:"DM Serif Display",Georgia,serif;font-size:37px;font-weight:400;line-height:1.04;letter-spacing:-.02em}.person p{margin:7px 0 0;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.illustration{position:relative;height:242px;margin:5px -7px -2px}
.glow{position:absolute;left:50%;top:24px;width:178px;height:178px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 47% 40%,var(--white) 0 8%,var(--yellow) 9% 41%,rgba(248,245,9,.35) 42% 58%,transparent 59%)}
.logo-se{position:absolute;z-index:3;left:50%;top:55px;width:112px;height:112px;transform:translateX(-50%);display:grid;place-items:center;border:1px solid rgba(19,9,41,.16);border-radius:22px;background:rgba(249,249,246,.91);box-shadow:0 13px 30px rgba(19,9,41,.16);backdrop-filter:blur(8px)}
.logo-se svg{width:83px;height:auto;display:block;color:var(--ink)}
.tower{position:absolute;left:50%;bottom:16px;width:105px;height:164px;transform:translateX(-50%);filter:drop-shadow(0 8px 0 rgba(92,82,122,.12));opacity:.46}
.wire{position:absolute;height:1px;background:var(--ink);opacity:.78;transform-origin:left center}.w1{width:150px;left:0;top:85px;transform:rotate(11deg)}.w2{width:150px;left:0;top:107px;transform:rotate(5deg)}.w3{width:150px;right:-20px;top:87px;transform:rotate(-11deg)}.w4{width:150px;right:-20px;top:109px;transform:rotate(-5deg)}
.bird{position:absolute;width:31px;height:18px;background:var(--ink);clip-path:polygon(0 42%,20% 17%,49% 45%,78% 12%,100% 39%,80% 29%,50% 62%,21% 34%);transform:rotate(-8deg)}.b1{left:48px;top:64px}.b2{right:56px;top:51px;transform:scale(.7) rotate(8deg)}
.since{position:absolute;left:50%;bottom:1px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;white-space:nowrap;font-family:"DM Serif Display",Georgia,serif;font-size:15px}.since::before,.since::after{content:"";width:40px;height:1px;background:var(--ink)}
.paper{position:relative;margin:0 -28px -26px;padding:29px 28px 25px;flex:1;background:var(--paper);border-radius:26px 26px 0 0;box-shadow:0 -12px 30px rgba(92,82,122,.16)}
.company{text-align:center}.company h2{margin:0;font-family:"DM Serif Display",Georgia,serif;font-size:27px;font-weight:400;line-height:1.08}.company p{margin:7px 0 0;color:var(--muted);font-size:12.5px;font-weight:570;line-height:1.4}
.scope{margin:14px 0 0;text-align:center;font-size:12px;font-weight:680;color:var(--purple)}
.contact{margin-top:17px;display:grid;grid-template-columns:1fr 1fr;gap:9px}.crow{min-height:46px;padding:10px 8px;border:1px solid #ded8ee;border-radius:11px;display:flex;align-items:center;gap:7px;color:var(--ink);background:var(--white);text-decoration:none;font-size:11px;font-weight:650;overflow:hidden}.crow svg{width:15px;height:15px;flex:none;stroke:var(--purple);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.crow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.save{grid-column:1/-1;min-height:47px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--white);text-decoration:none;font-size:13px;font-weight:750}
.foot{margin:14px 0 0;text-align:center;color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.02em}.pdf-connect{display:none}.pdf-connect-in{display:flex;align-items:center;justify-content:space-between;padding:19px 20px;border-radius:12px;background:var(--ink);color:var(--white);text-decoration:none}.pdf-connect strong{font-size:16px;font-weight:800}.pdf-connect svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.person,.illustration,.paper{animation:arrive .65s cubic-bezier(.16,1,.3,1) both}.illustration{animation-delay:.07s}.paper{animation-delay:.14s}@media(prefers-reduced-motion:reduce){.person,.illustration,.paper{animation:none}}
@media(max-height:700px){body{align-items:flex-start;overflow-y:auto}.card{height:auto;min-height:100dvh;max-height:none;overflow:visible}.illustration{height:210px}.tower{height:145px}.paper{flex:none}}
@page{margin:0}
@media print{body{padding:0;display:block;background:var(--lilac)}.card{width:100%;height:auto;max-height:none;padding:32px 30px 0;border-radius:0;box-shadow:none;overflow:hidden}.person,.illustration,.paper{animation:none;opacity:1;transform:none}.illustration{height:240px;margin-top:7px}.paper{margin:0 -30px;padding:32px 30px 29px;flex:none;border-radius:26px 26px 0 0}.contact{display:block;margin-top:23px}.crow,.save{display:none}.pdf-connect{display:block}.foot{margin-top:21px}}
</style>
</head>
