.paper{position:relative;margin:0 -28px -26px;padding:29px 28px 25px;flex:1;background:var(--paper);border-radius:26px 26px 0 0;box-shadow:0 -12px 30px rgba(92,82,122,.16)}
.company{text-align:center}.company h2{margin:0;font-family:"DM Serif Display",Georgia,serif;font-size:27px;font-weight:400;line-height:1.08}.company p{margin:7px 0 0;color:var(--muted);font-size:12.5px;font-weight:570;line-height:1.4}
.scope{margin:14px 0 0;text-align:center;font-size:12px;font-weight:680;color:var(--purple)}
.contact{margin-top:17px;display:grid;grid-template-columns:1fr 1fr;gap:9px}.crow{min-height:46px;padding:10px 8px;border:1px solid #ded8ee;border-radius:11px;display:flex;align-items:center;gap:7px;color:var(--ink);background:var(--white);text-decoration:none;font-size:11px;font-weight:650;overflow:hidden}.crow svg{width:15px;height:15px;flex:none;stroke:var(--purple);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.crow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.save{grid-column:1/-1;min-height:47px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--ink);color:var(--white);text-decoration:none;font-size:13px;font-weight:750}
.foot{margin:14px 0 0;text-align:center;color:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.02em}.pdf-connect{display:none}.pdf-connect-in{display:flex;align-items:center;justify-content:space-between;padding:19px 20px;border-radius:12px;background:var(--ink);color:var(--white);text-decoration:none}.pdf-connect strong{font-size:16px;font-weight:800}.pdf-connect svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.person,.illustration,.paper{animation:arrive .65s cubic-bezier(.16,1,.3,1) both}.illustration{animation-delay:.07s}.paper{animation-delay:.14s}@media(prefers-reduced-motion:reduce){.person,.illustration,.paper{animation:none}}
@media(max-height:700px){body{align-items:flex-start;overflow-y:auto}.card{height:auto;min-height:100dvh;max-height:none;overflow:visible}.illustration{height:210px}.tower{height:145px}.paper{flex:none}}
@page{margin:0}
@media print{body{padding:0;display:block;background:var(--lilac)}.card{width:100%;height:auto;max-height:none;padding:32px 30px 0;border-radius:0;box-shadow:none;overflow:hidden}.person,.illustration,.paper{animation:none;opacity:1;transform:none}.illustration{height:240px;margin-top:7px}.paper{margin:0 -30px;padding:32px 30px 29px;flex:none;border-radius:26px 26px 0 0}.contact{display:block;margin-top:23px}.crow,.save{display:none}.pdf-connect{display:block}.foot{margin-top:21px}}
