<title>Suchetana Electricals — Digital Card</title>
<meta name="description" content="Suchetana Electricals — Electrical Engineers & Contractors, Bengaluru.">
<meta name="theme-color" content="#c7baf4">
<style>
:root{--lavender:#c7baf4;--purple:#775ac1;--ink:#120927;--paper:#fff;--line:#d8d1eb}
*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:#8e7bcf}
body{margin:0;min-height:100dvh;padding:clamp(0px,3vw,28px);display:flex;align-items:center;justify-content:center;background:#8e7bcf;color:var(--ink);font-family:"Segoe UI",Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:#f8f509;color:var(--ink)}:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.card{position:relative;width:min(100%,430px);aspect-ratio:2/3;overflow:hidden;background:var(--paper)}
.art{position:absolute;inset:0 0 auto;width:100%;height:auto;display:block}
.address-hotspot{position:absolute;z-index:3;left:23.4%;top:63.3%;width:66%;height:5.3%;border-radius:5px;color:transparent;text-decoration:none}
.address-hotspot:focus-visible{outline-color:var(--purple)}
.contact-panel{position:absolute;z-index:2;left:0;right:0;bottom:0;height:25.4%;padding:3.1% 8.8% 2.4%;background:var(--paper);box-shadow:0 -9px 28px rgba(92,82,122,.08)}
.contact-grid{height:100%;display:grid;grid-template-columns:31px 1fr;grid-template-rows:repeat(5,minmax(0,1fr));column-gap:14px;align-items:center}
.icon{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:var(--lavender);color:var(--ink)}.icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.link{min-width:0;align-self:stretch;display:flex;align-items:center;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);font-size:11.3px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}.link:last-of-type{border-bottom:0}.link:hover{text-decoration:underline;text-underline-offset:3px}
.link .label{font-weight:750;margin-right:4px}.gst{font-size:10.8px;font-weight:680;color:#55476f}
@media(min-width:481px){.card{border-radius:18px;box-shadow:0 30px 80px -34px rgba(19,9,41,.7)}}
@media(max-width:480px){body{padding:0}.card{width:100vw;height:auto;max-height:100dvh}}
@page{margin:0}
@media print{body{padding:0;display:block;background:#fff}.card{width:100%;border-radius:0;box-shadow:none}.link:hover{text-decoration:none}}
</style>
