<title>Suchetana Electricals — Digital Card</title>

<meta name="theme-color" content="#c7baf4">
<style>
:root{--lavender:#c7baf4;--ink:#120927;--paper:#fff;--purple:#775ac1;--line:#ded8ee}
*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:#8e7bcf}
body{margin:0;min-height:100dvh;padding:clamp(0px,3vw,28px);display:flex;align-items:center;justify-content:center;background:#8e7bcf;color:var(--ink);font-family:"Segoe UI",Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:#f8f509;color:var(--ink)}:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.card{position:relative;width:min(100%,430px);aspect-ratio:2/3;overflow:hidden;background:var(--paper)}
.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.address-hotspot{position:absolute;z-index:3;left:23.5%;top:63.2%;width:66%;height:5.6%;border-radius:4px;color:transparent;text-decoration:none}
.contact-panel{position:absolute;z-index:2;left:0;right:0;bottom:0;height:22.9%;padding:5px 39px 7px;background:var(--paper)}
.contact-grid{height:100%;display:grid;grid-template-columns:32px 1fr;grid-template-rows:repeat(5,minmax(0,1fr));column-gap:13px;align-items:center}
.icon{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--lavender);color:var(--ink)}.icon svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.link{min-width:0;align-self:stretch;display:flex;align-items:center;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);font-size:10.8px;font-weight:600;line-height:1.15;white-space:nowrap}.link:last-of-type{border-bottom:0}.link:hover{text-decoration:underline;text-underline-offset:2px}.label{font-weight:760;margin-right:3px}.gst{font-size:10.8px;color:#55476f}
@media(min-width:481px){.card{border-radius:18px;box-shadow:0 30px 80px -34px rgba(19,9,41,.7)}}
@media(max-width:480px){body{padding:0}.card{width:100vw}}
@media(max-width:350px){.contact-panel{padding-left:28px;padding-right:28px}.contact-grid{column-gap:10px}.link,.gst{font-size:10px}}
@page{margin:0}
@media print{body{padding:0;display:block;background:#fff}.card{width:100%;border-radius:0;box-shadow:none}.link:hover{text-decoration:none}}
</style>
