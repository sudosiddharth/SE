<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Suchetana Electricals — Digital Card</title>
<meta name="description" content="Suchetana Electricals — Electrical Engineers & Contractors, Bengaluru.">
<meta name="theme-color" content="#c7baf4">
<style>
:root{--lavender:#c7baf4;--purple:#775ac1;--ink:#120927;--paper:#fff;--line:#d8d1eb}
*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%;background:#8e7bcf}
body{margin:0;min-height:100dvh;padding:clamp(0px,3vw,28px);display:flex;align-items:center;justify-content:center;background:#8e7bcf;color:var(--ink);font-family:"Segoe UI",Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
::selection{background:#f8f509;color:var(--ink)}:focus-visible{outline:3px solid var(--purple);outline-offset:3px}
.card{position:relative;width:min(100%,430px);height:auto;overflow:hidden;background:var(--paper)}
.artwork{position:relative}.art{position:relative;width:100%;height:auto;display:block}
.address-hotspot{position:absolute;z-index:3;left:23.4%;top:90.4%;width:66%;height:8.4%;border-radius:5px;color:transparent;text-decoration:none}
.address-hotspot:focus-visible{outline-color:var(--purple)}
.contact-panel{position:relative;z-index:2;padding:15px 38px 18px;background:var(--paper);box-shadow:0 -9px 28px rgba(92,82,122,.08)}
.contact-grid{display:grid;grid-template-columns:36px 1fr;grid-template-rows:repeat(5,48px);column-gap:14px;align-items:center}
.icon{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--lavender);color:var(--ink)}.icon svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.link{min-width:0;height:48px;display:flex;align-items:center;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}.link:last-of-type{border-bottom:0}.link:hover{text-decoration:underline;text-underline-offset:3px}
.link .label{font-weight:750;margin-right:4px}.gst{font-size:12.5px;font-weight:680;letter-spacing:.03em;color:#55476f}
@media(min-width:481px){.card{border-radius:18px;box-shadow:0 30px 80px -34px rgba(19,9,41,.7)}}
@media(max-width:480px){body{padding:0;align-items:flex-start}.card{width:100vw}}
@media(max-width:360px){.contact-panel{padding-left:28px;padding-right:28px}.contact-grid{grid-template-columns:34px 1fr;column-gap:11px}.link{font-size:12.5px}}
@page{margin:0}
@media print{body{padding:0;display:block;background:#fff}.card{width:100%;border-radius:0;box-shadow:none}.link:hover{text-decoration:none}}
</style>
</head>
<body>
<main class="card" aria-label="Suchetana Electricals digital business card">
  <div class="artwork">
    <img class="art" src="assets/reference-top.jpg" alt="M.S. Madhusudan, Proprietor, Suchetana Electricals, since 1969">
    <a class="address-hotspot" href="https://share.google/spEJ6NaxoDpTfBJEm" target="_blank" rel="noopener" aria-label="Open #36, 1st Cross, N.S. Iyengar Street, Seshadripuram, Bangalore 560020 in maps">Address</a>
  </div>
  <section class="contact-panel" aria-label="Contact information">
    <div class="contact-grid">
      <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h3.5l1.8 4.4-2.2 1.3a11 11 0 0 0 5.7 5.7l1.3-2.2 4.4 1.8V19a1.5 1.5 0 0 1-1.6 1.5A16.5 16.5 0 0 1 3.5 6.1 1.5 1.5 0 0 1 5 4.5z"/></svg></span>
      <a class="link" href="tel:+919845013813"><span><span class="label">Cell:</span>98450 13813</span></a>
      <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.8 20.2l1.2-4a8 8 0 1 1 3 2.9z"/><path d="M9 9.2c0 3 2.4 5.4 5.4 5.4l.9-1.6-1.9-.8-.8.9a4.4 4.4 0 0 1-2-2l.9-.8-.8-1.9z"/></svg></span>
      <a class="link" href="https://wa.me/919845013813" target="_blank" rel="noopener"><span><span class="label">WhatsApp:</span>98450 13813</span></a>
      <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5.5h17v13h-17z"/><path d="M3.5 7 12 13l8.5-6"/></svg></span>
      <a class="link" href="mailto:suchetanaele@gmail.com"><span><span class="label">Email:</span>suchetanaele@gmail.com</span></a>
      <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M2.8 12h18.4M12 2.8a15 15 0 0 1 0 18.4 15 15 0 0 1 0-18.4"/></svg></span>
      <a class="link" href="https://suchetana-electricals-v2.vercel.app/" target="_blank" rel="noopener"><span><span class="label">Website:</span>suchetana-electricals-v2.vercel.app</span></a>
      <span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg></span>
      <span class="link gst"><span class="label">GST 29ACGPM4809H1ZE</span></span>
    </div>
  </section>
</main>
</body>
</html>
