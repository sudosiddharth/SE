<style>
:root{
  --purple:#580C90;
  --purple-deep:#3F0669;
  --yellow:#F6C92F;
  --paper:#FFFFFF;
  --ink:#21052F;
  --muted:#684D74;
  --line:rgba(88,12,144,.14);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--purple-deep)}
body{
  margin:0;min-height:100dvh;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));
  display:grid;place-items:center;background:var(--purple-deep);color:var(--ink);
  font-family:"Archivo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--yellow);color:var(--purple-deep)}
:focus-visible{outline:3px solid var(--yellow);outline-offset:4px}
.shell{
  width:min(430px,calc(100vw - 36px));min-height:min(760px,calc(100dvh - 36px));
  padding:24px 22px 20px;border-radius:22px;background:var(--paper);
  box-shadow:0 28px 80px -38px rgba(0,0,0,.72);
  display:flex;flex-direction:column;justify-content:center;
}
.identity{text-align:center}
.mark-tile{
  width:136px;aspect-ratio:1;margin:0 auto 17px;
  border:3px solid var(--purple);border-radius:5px;
  background:var(--yellow);display:grid;place-items:center;
}
.mark{width:82%;height:auto;color:var(--purple);display:block}
h1{
  margin:0;font-family:"Anton","Archivo",sans-serif;font-size:clamp(34px,10vw,43px);
  font-weight:400;line-height:.98;letter-spacing:-.01em;text-wrap:balance;color:var(--purple);
}
.sub{margin:10px auto 0;max-width:29ch;color:var(--muted);font-size:14px;font-weight:530;line-height:1.45}
.actions{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:27px;
}
.action{
  min-width:0;min-height:112px;padding:15px 13px;border:1px solid var(--line);border-radius:14px;
  color:var(--purple);background:var(--paper);text-decoration:none;
  display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;
  transition:transform .18s cubic-bezier(.16,1,.3,1),background-color .18s ease,color .18s ease,border-color .18s ease;
}
.action svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.action strong{font-size:16px;font-weight:750;line-height:1}
.action small{display:block;margin-top:5px;color:var(--muted);font-size:11px;font-weight:560;line-height:1.25;overflow-wrap:anywhere}
.action--primary{background:var(--purple);border-color:var(--purple);color:var(--paper)}
.action--primary small{color:rgba(255,255,255,.74)}
.action--whatsapp{background:var(--yellow);border-color:var(--yellow);color:var(--purple-deep)}
.action--whatsapp small{color:rgba(63,6,105,.72)}
@media (hover:hover){
  .action:hover{transform:translateY(-3px);border-color:var(--purple);background:#F8F2FC}
  .action--primary:hover{background:var(--purple-deep);color:var(--paper)}
  .action--whatsapp:hover{background:#FFD84D;color:var(--purple-deep)}
}
.action:active{transform:translateY(0) scale(.985)}
.note{
  margin:20px 0 0;padding-top:17px;border-top:1px solid var(--line);text-align:center;
  color:var(--muted);font-size:12px;font-weight:540;line-height:1.45;
}
.note b{color:var(--purple);font-weight:750}
@keyframes lockup{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes actions-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.identity{animation:lockup .7s cubic-bezier(.16,1,.3,1) both}
.actions,.note{animation:actions-in .55s cubic-bezier(.16,1,.3,1) .18s both}
@media (prefers-reduced-motion:reduce){.identity,.actions,.note{animation:none}.action{transition:none}}
@media (orientation:landscape) and (max-height:600px){
  body{padding:12px}
  .shell{
    width:min(820px,calc(100vw - 24px));min-height:calc(100dvh - 24px);
    padding:18px 22px;border-radius:18px;
    display:grid;grid-template-columns:minmax(230px,.8fr) minmax(360px,1.2fr);
    grid-template-rows:1fr auto;column-gap:28px;row-gap:10px;align-items:center;
  }
  .identity{grid-column:1;grid-row:1;text-align:left;align-self:end}
  .mark-tile{width:96px;margin:0 0 13px}
  h1{font-size:34px;max-width:8ch}
  .sub{margin:8px 0 0;max-width:24ch}
  .actions{grid-column:2;grid-row:1 / span 2;margin:0;align-self:center}
  .action{min-height:96px}
  .note{grid-column:1;grid-row:2;margin:0;padding-top:12px;text-align:left;align-self:start}
}
@media (max-height:690px) and (orientation:portrait){
  body{padding:0}.shell{min-height:100dvh;border-radius:0;padding-top:16px;padding-bottom:14px}
  .mark-tile{width:108px;margin-bottom:12px}.actions{margin-top:18px}.action{min-height:92px}.note{margin-top:14px;padding-top:12px}
}
@media (max-width:350px){
  .shell{padding-left:16px;padding-right:16px}.actions{gap:8px}.action{min-height:104px;padding:13px 11px}
}
</style>
